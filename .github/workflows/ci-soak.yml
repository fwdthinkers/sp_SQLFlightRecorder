# =============================================================================
# Soak CI (D-145) — OUT-OF-BAND, NON-BLOCKING
# -----------------------------------------------------------------------------
# Runs the soak harness on a schedule and on demand only — never on
# push/pull_request — so it cannot gate a PR or the v1.0.0-rc (D-145 soak is
# explicitly out-of-band; failures are handled in release planning). It drives
# many Collect cycles and asserts no error steps accumulate, Report stays under
# 5 s, and Purge keeps repo growth bounded. This nightly run is a scaled proxy;
# the full 24 h soak (D-145) is run out-of-band on dedicated infra before a
# release. Build-pipeline only (D-148).
# =============================================================================

name: ci-soak

on:
  schedule:
    - cron: '41 3 * * *'   # nightly, out-of-band
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Collect cycles to soak'
        required: false
        default: '60'

permissions:
  contents: read

concurrency:
  group: ci-soak
  cancel-in-progress: true

jobs:
  soak:
    name: Soak (out-of-band, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CYCLES: ${{ github.event.inputs.cycles || '60' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run soak harness (SQL Server 2022)
        run: |
          set -euo pipefail
          N="${CYCLES}"
          [[ "${N}" =~ ^[0-9]+$ ]] || N=60
          bash tests/perf/run-soak.sh mcr.microsoft.com/mssql/server:2022-latest "${N}"
